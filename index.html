<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Мессенджер</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Вход -->
  <div class="login" id="loginScreen">
    <div class="login__box">
      <div class="login__logo">💬</div>
      <h1>Мессенджер</h1>
      <p>Войди или создай аккаунт</p>
      <input type="text" id="loginInput" placeholder="username (латиница)" maxlength="20">
      <input type="password" id="passwordInput" placeholder="Пароль" maxlength="64">
      <button id="loginBtn">Войти</button>
      <div class="login__error" id="loginError"></div>
    </div>
  </div>

  <!-- Приложение -->
  <div class="app" id="appScreen" style="display:none">
    <aside class="sidebar">
      <header class="sidebar__header">
        <button class="me" id="myProfileBtn">
          <div class="me__avatar" id="meAvatar">?</div>
          <div class="me__name" id="meLabel">—</div>
        </button>
        <button class="icon-btn" id="createBtn">➕</button>
      </header>

      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="Поиск" autocomplete="off">
      </div>

      <ul class="chat-list" id="chatList"></ul>
    </aside>

    <main class="chat">
      <header class="chat__header">
        <button class="icon-btn back-btn" id="backBtn">←</button>
        <button class="chat__user" id="chatUserBtn">
          <div class="chat__avatar" id="chatAvatar">?</div>
          <div class="chat__info">
            <div class="chat__name" id="chatName">Выберите чат</div>
            <div class="chat__status" id="chatStatus"></div>
          </div>
        </button>
      </header>

      <div class="messages" id="messages"></div>

      <form class="composer" id="composer">
        <button type="button" class="icon-btn" id="stickerBtn">😊</button>
        <input type="text" id="messageInput" placeholder="Сообщение" autocomplete="off" disabled>
        <button type="submit" class="send-btn" id="sendBtn" disabled>➤</button>
      </form>
    </main>
  </div>

  <!-- Модалка создания -->
  <div class="modal" id="createModal">
    <div class="modal__backdrop" data-close></div>
    <div class="modal__box">
      <button class="modal__close" data-close>✕</button>
      <h2 class="modal__title">Создать</h2>
      
      <div class="create-menu" id="createMenu">
        <button class="create-item" data-type="private">
          <span>👤</span> Личный чат
        </button>
        <button class="create-item" data-type="group">
          <span>👥</span> Группа
        </button>
        <button class="create-item" data-type="channel">
          <span>📢</span> Канал
        </button>
        <button class="create-item" data-type="bot">
          <span>🤖</span> Бот
        </button>
      </div>

      <div class="create-form" id="createForm" style="display:none">
        <input type="text" id="newTitle" placeholder="Название">
        <div id="newMembers" class="members-list"></div>
        <button class="btn-primary" id="createSubmit">Создать</button>
      </div>
    </div>
  </div>

  <!-- Панель стикеров -->
  <div class="sheet" id="stickerSheet">
    <div class="sheet__backdrop" data-close></div>
    <div class="sheet__box">
      <div class="sticker-grid" id="stickerGrid"></div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
</body>
</html>
