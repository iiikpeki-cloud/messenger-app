<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Мессенджер</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Экран входа -->
  <div class="login" id="loginScreen">
    <div class="login__box">
      <div class="login__logo">💬</div>
      <h1>Мессенджер</h1>
      <p>Войди или создай аккаунт</p>
      <input type="text" id="loginInput" placeholder="username (латиница)" maxlength="20" autocomplete="username">
      <input type="password" id="passwordInput" placeholder="Пароль" maxlength="64" autocomplete="current-password">
      <button id="loginBtn">Войти</button>
      <div class="login__hint">Новый username → аккаунт создастся автоматически</div>
      <div class="login__error" id="loginError"></div>
    </div>
  </div>

  <!-- Экран выбора display name -->
  <div class="login" id="nameScreen" style="display:none">
    <div class="login__box">
      <div class="login__logo">✨</div>
      <h1>Как тебя зовут?</h1>
      <p>Это имя увидят другие</p>
      <input type="text" id="displayNameInput" placeholder="Отображаемое имя" maxlength="30">
      <button id="saveNameBtn">Продолжить</button>
      <div class="login__error" id="nameError"></div>
    </div>
  </div>

  <!-- Основной интерфейс -->
  <div class="app" id="appScreen" style="display:none">
    <aside class="sidebar">
      <header class="sidebar__header">
        <button class="me" id="myProfileBtn" title="Мой профиль">
          <div class="me__avatar" id="meAvatar">?</div>
          <div class="me__name" id="meLabel">—</div>
        </button>
        <button class="icon-btn" id="adminBtn" title="Админка" style="display:none">🛡</button>
        <button class="icon-btn" id="settingsBtn" title="Настройки">⚙</button>
      </header>

      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="Поиск" autocomplete="off">
      </div>

      <ul class="chat-list" id="chatList"></ul>
      <div class="no-users" id="noUsers">Пока никого нет.<br>Открой второе окно и войди под другим username.</div>
    </aside>

    <main class="chat">
      <header class="chat__header">
        <button class="icon-btn back-btn" id="backBtn" title="Назад">←</button>
        <button class="chat__user" id="chatUserBtn" title="Профиль">
          <div class="chat__avatar" id="chatAvatar">?</div>
          <div class="chat__info">
            <div class="chat__name" id="chatName">Выберите собеседника</div>
            <div class="chat__status" id="chatStatus"></div>
          </div>
        </button>
        <button class="icon-btn" id="giftBtn" title="Подарок" style="margin-left:auto; display:none">🎁</button>
      </header>

      <div class="messages" id="messages">
        <div class="empty-chat" id="emptyChat">
          <div class="empty-chat__icon">💬</div>
          <div>Выберите, кому хотите написать</div>
        </div>
      </div>

      <form class="composer" id="composer">
        <input type="text" id="messageInput" placeholder="Написать сообщение..." autocomplete="off" disabled>
        <button type="submit" class="send-btn" id="sendBtn" disabled>➤</button>
      </form>
    </main>
  </div>

  <!-- Панель подарков -->
  <div class="sheet" id="giftSheet">
    <div class="sheet__backdrop" data-close></div>
    <div class="sheet__box">
      <div class="sheet__header">
        <h2>Подарок</h2>
        <button class="icon-btn" data-close>✕</button>
      </div>
      <div class="gift-grid" id="giftGrid"></div>
    </div>
  </div>

  <!-- Модалка профиля -->
  <div class="modal" id="profileModal">
    <div class="modal__backdrop" data-close></div>
    <div class="modal__box">
      <button class="modal__close" data-close>✕</button>
      <div class="profile" id="profileContent"></div>
    </div>
  </div>

  <!-- Панель настроек -->
  <div class="settings" id="settingsScreen">
    <header class="settings__header">
      <button class="icon-btn" id="settingsBack">←</button>
      <h1>Настройки</h1>
    </header>
    <div class="settings__body" id="settingsBody"></div>
  </div>

  <!-- Панель админки -->
  <div class="settings" id="adminScreen">
    <header class="settings__header">
      <button class="icon-btn" id="adminBack">←</button>
      <h1>🛡 Админ-панель</h1>
    </header>
    <div class="settings__body" id="adminBody"></div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
</body>
</html>
